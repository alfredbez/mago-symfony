# Configuration for this repository's fixture suite. Applications write their own.
version = "1"
php-version = "8.3"

[source]
paths = ["tests/fixtures"]
includes = [
    "vendor/symfony/config",
    "vendor/symfony/console",
    "vendor/symfony/dependency-injection",
    "vendor/symfony/event-dispatcher",
    "vendor/symfony/event-dispatcher-contracts",
    "vendor/symfony/form",
    "vendor/symfony/framework-bundle",
    "vendor/symfony/http-foundation",
    "vendor/symfony/http-kernel",
    "vendor/symfony/messenger",
    "vendor/symfony/routing",
    "vendor/symfony/security-bundle",
    "vendor/symfony/security-core",
    "vendor/symfony/security-http",
    "vendor/symfony/serializer",
    "vendor/symfony/service-contracts",
    "vendor/symfony/validator",
    "vendor/psr/container",
    "vendor/psr/event-dispatcher",
]

[analyzer]
find-unused-definitions = false
find-unused-expressions = false
check-property-initialization = false

[extension-hosts.symfony]
command = ["php", "bin/mago-symfony-worker"]
workers = 1
