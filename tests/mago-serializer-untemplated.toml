version = "1"
php-version = "8.3"

[source]
paths = ["tests/fixtures-serializer-untemplated"]
includes = ["tests/stubs-serializer-untemplated"]

[analyzer]
find-unused-definitions = false
find-unused-expressions = false
check-property-initialization = true

[extension-hosts.symfony]
command = ["php", "worker.php"]
workers = 1
